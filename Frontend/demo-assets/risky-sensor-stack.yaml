AWSTemplateFormatVersion: '2010-09-09'
Description: Manufacturing sensor ingestion stack (demo - intentionally includes a public bucket policy and open RDP ingress)

Resources:
  SensorDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sensor-readings
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  PublicArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: mfg-public-artifacts-demo

  PublicBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublicArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::mfg-public-artifacts-demo/*'

  OpenRdpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: sg-0fedcba9876543210
      IpProtocol: tcp
      FromPort: 3389
      ToPort: 3389
      CidrIp: 0.0.0.0/0
